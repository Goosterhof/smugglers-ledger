name: The Shipment — Release

# The Smuggler moves goods without ceremony. Pushing a version tag (v*) wakes
# a Windows runner, builds and SIGNS the Ledger, and publishes the NSIS
# installer plus the updater manifest (latest.json) to a GitHub Release. The
# installed Ledger's updater reads latest.json from this release's assets,
# verifies the bundle's minisign seal against the baked-in pubkey, and offers
# TAKE DELIVERY on next boot. Shape borrowed from the Mezzanine's Ascent
# (gadgets/mezzanine/.github/workflows/ascent.yml); the Archive's
# tauri-updater.md carries the scars this wiring obeys — passwordless key
# with an EMPTY password secret, NSIS-only for an unambiguous manifest,
# committed Cargo.lock so the release cannot drift onto a broken dependency.
#
# Required secrets (the private key file lives in the investor's home at
# ~/.smugglers-ledger-updater.key — escrow it; lose it and no future build
# can produce an update an installed Ledger will accept):
#   TAURI_SIGNING_PRIVATE_KEY          — the minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — empty string (passwordless key)
#
# Cut a shipment by tagging the version in tauri.conf.json:
#     git tag v0.1.0 && git push origin v0.1.0
#
# The version lives in package.json + tauri.conf.json + Cargo.toml (+ lockfiles);
# bump them together before tagging — a tag that disagrees with the built
# version confuses every download that follows.

on:
    push:
        tags:
            - 'v*'

# tauri-action creates the release and uploads assets — it needs write.
permissions:
    contents: write

jobs:
    shipment:
        # Windows is the only deployment target — the Ledger reads Windows
        # save paths and applies to a Windows desktop. Built where it runs.
        runs-on: windows-latest

        # Actions pinned to full commit SHAs, matching the Ascent's posture:
        # this job holds the minisign signing private key in its env — the
        # credential whose loss or theft is unrecoverable — so a compromised
        # release of a mutable tag could exfiltrate it (the tj-actions attack
        # class). SHA pins make the supplied action bytes immutable;
        # Dependabot still bumps them. Keep the pins on any workflow that
        # touches this secret.

        steps:
            - name: Check out the tagged ledger
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Set up the Rust toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (pinned)

            # Reuse the Rust build cache between shipments — the Tauri crate
            # graph compiles once and rests in the cache thereafter.
            - name: Cache the Rust build
              uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: src-tauri

            - name: Install frontend dependencies
              run: npm ci

            # tauri-action builds the frontend (beforeBuildCommand), compiles
            # the Rust spine in release mode, bundles, and publishes. NSIS only:
            # one artifact on the release page means the brother never has to
            # ask which file to download. `bundle.targets` keeps `msi` for
            # local `npm run tauri build`; the shipment ships one thing.
            - name: Build, seal, and publish the shipment
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: "The Smuggler's Ledger ${{ github.ref_name }}"
                  releaseBody: |
                      A new shipment has cleared the border. An installed Ledger (v0.3.0+)
                      offers to take delivery on its own at next boot — or download the
                      installer below. Zero configuration, strictly read-only, seal
                      verified at the door.
                  releaseDraft: false
                  prerelease: false
                  args: --bundles nsis
