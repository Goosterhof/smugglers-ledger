# ============================================================================
# THE SENTINEL — Smuggler's Ledger Containment Protocols (repo-local)
# ============================================================================
# Runs on every push to main and every PR against main in THIS repo — the
# gadget gates its own pull requests (Decision 019), mirroring the Cube, the
# Mezzanine, and the experiment submodules. A parent-side path filter on a
# gitlink pointer bump never matches, so the gate must live here.
#
# Three jobs:
#   * containment    — frontend (Vue/TS): typecheck, lint, test, format, build
#   * rust-substrate — backend (Rust):    fmt, clippy, build, test
#   * the-two-floors — RD-2 read-only sweep + RD-3 legal-floor sweep
#
# The [GATE] cargo tests run on committed, anonymised byte fixtures — the
# Sentinel never sees a real save file. [BENCH] criteria (tests/bench_real.rs)
# are env-gated + #[ignore]d and run only on the Scientist's bench.
# ============================================================================

name: Sentinel — Smuggler's Ledger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  containment:
    name: Frontend — Typecheck + Lint + Test + Format + Build
    runs-on: ubuntu-latest
    # Ceiling for the whole job — the step guard covers the hang we have met,
    # this covers the next one. A Sentinel job that runs long is broken, not busy.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (the six voiced states, gated)
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # The legal floor needs the built bundle in reach (Sweep 2).
      - name: RD-3 legal-floor audit
        run: bash scripts/legal-floor-audit.sh

  rust-substrate:
    name: Rust — Fmt + Clippy + Build + Test
    runs-on: ubuntu-latest
    # Ceiling for the whole job — the step guard covers the hang we have met,
    # this covers the next one. A Sentinel job that runs long is broken, not busy.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        # A bare apt-get has no retry and no ceiling: hand it a bad mirror and
        # it waits forever. That is not a hypothetical — this step hung for
        # 15 minutes on PR #27 and #28, and for SIX HOURS on the v0.11.0
        # release run before someone cancelled it. Retries make the common
        # flake self-heal; the timeout turns the uncommon one into a fast red
        # instead of a runner burning the afternoon.
        #
        # 15, not 8: the step took 5m09s on a run that SUCCEEDED the same day
        # (job 96018269109), against a ~90s baseline. A ceiling has to clear
        # the worst honest run by a wide margin or it just manufactures reds
        # of its own — and 15 minutes still turns a six-hour hang into a
        # twenty-fourth of one.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri's codegen requires the frontendDist directory to exist.
      - name: Provide an empty frontend dist
        run: mkdir -p ../dist
        working-directory: src-tauri

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test (every [GATE] criterion — committed fixtures only)
        run: cargo test

  the-two-floors:
    name: RD-2 Read-Only Sweep
    runs-on: ubuntu-latest
    # Ceiling for the whole job — the step guard covers the hang we have met,
    # this covers the next one. A Sentinel job that runs long is broken, not busy.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: RD-2 read-only audit
        run: bash scripts/read-only-audit.sh
