[package]
name = "smugglers-ledger"
version = "0.1.0"
description = "The Smuggler's Ledger — one searchable overview of everything you own across the whole of Cairn. Read-only, offline, zero-config."
authors = ["Gerard Oosterhof <gerard@script.nl>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "smugglers_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# The codex's shelves: database.arz records are LZ4 block-compressed,
# Text_EN.arc localization parts likewise. Pure Rust, no C toolchain.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
# Cache key: the install's database file identity. SHA-256 of size+mtime+head bytes.
sha2 = "0.10"
# The watch: save-file change events, debounced in watch.rs.
notify = "8"
# Documents/ and app-data paths for discovery and the codex cache.
dirs = "6"

[target.'cfg(windows)'.dependencies]
# Steam names its own install root in the registry; discovery reads it, never guesses.
winreg = "0.55"

[dev-dependencies]
# Fixture-tree scaffolding for the discovery/ledger/watch integration tests —
# tests build trees and set mtimes; the shipped modules never write (RD-2).
tempfile = "3"
filetime = "0.2"
# The codex-cache tests forge a minimal valid .arz/.arc pair, which needs the
# compression direction the app itself never uses.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
